<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;600;700&family=Roboto:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/shared-styles.css">
  <link rel="stylesheet" href="/shared-gallery.css">
  <title>Project Detail</title>
</head>

<body>
  <div id="site-nav"></div>

  <main class="project-detail">
    <div class="project-header">
      <img class="project-title" src="" alt="Project logo" />
      <p class="project-subtitle"></p>
    </div>

    <!-- Main Machine Console Container -->
    <div class="machine-console">
      <div class="description-play-row">
        <p id="projectDescription" class="project-description"></p>

        <a href="#" target="_blank" rel="noopener" class="btn-click-to-play">
          <span class="play-label">Click to Play</span>
          <span class="play-eyebrow">Eyebrow</span>
        </a>
      </div>

      <!-- Quadrant-Style Metadata Grid -->
      <div class="project-meta">
        <div class="meta-item">
          <div class="meta-label">Project type</div>
          <div id="tags" class="meta-value"></div>
        </div>
        <div class="meta-item is-lit">
          <div class="meta-label">Release Year</div>
          <div id="releaseYear" class="meta-value">-</div>
        </div>
        <div class="meta-item is-lit">
          <div class="meta-label">Platforms</div>
          <div id="platforms" class="meta-value">-</div>
        </div>
      </div>

      <!-- Embedded YouTube Video Section -->
      <section class="project-video-section" aria-labelledby="videoHeading">
        <h2 id="videoHeading">Demo video</h2>
        <div class="video-frame">
          <iframe src="" title="Project Demo Video" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </section>

      <!-- Info & Tech Breakdown -->
      <div class="project-content">
        <h2>Gameplay</h2>
        <p></p>

        <h2>Development</h2>
        <p></p>

        <h2>Tech</h2>
        <ul class="tech-list">
          <li></li>
        </ul>
      </div>

      <!-- Gallery Section (Compatible with shared-gallery.css / shared-gallery.js) -->
      <section class="project-gallery-section" aria-labelledby="galleryHeading">
        <h2 id="galleryHeading">Screenshots</h2>
        <div id="projectGallery" class="image-gallery project-gallery">
          <!-- Gallery items will be populated by JavaScript -->
        </div>
      </section>

      <!-- External Links -->
      <div class="project-links">
        <a id="liveLink" class="btn-terminal" href="#" target="_blank" rel="noopener">s&amp;box Game Page</a>
        <a id="workshopLink" class="btn-terminal" href="#" target="_blank" rel="noopener">Steam Workshop Page</a>
      </div>
    </div>
  </main>

  <script src="layout.js"></script>
  <script src="shared-gallery.js"></script>

  <script>
    // This script will be populated with individual project data
    async function initProject() {
      try {
        const projects = await window.SiteUtils.fetchJson("projects.json");
        const project = projects.find(p => p.title === "PROJECT_TITLE_PLACEHOLDER");

        if (project) {
          // Update title and subtitle
          document.querySelector('.project-title').src = project.thumbnail || '';
          document.querySelector('.project-title').alt = project.title + " logo";
          document.querySelector('.project-subtitle').textContent = project.description;

          // Update meta information
          document.getElementById('releaseYear').textContent = project.release || '-';
          document.getElementById('platforms').textContent = project.platforms ? project.platforms.join(', ') : '-';

          // Update tags
          const tags = project.tags || [];
          // Filter out category tags (Personal, Professional, School)
          const techTags = tags.filter(tag => !['Personal', 'Professional', 'School', '2010s', '2020s'].includes(tag));
          document.getElementById('tags').textContent = techTags.length > 0 ? techTags.join(', ') : '-';

          // Update description
          document.getElementById('projectDescription').textContent = project.description || '-';

          // Set links
          const liveLink = document.getElementById('liveLink');
          const workshopLink = document.getElementById('workshopLink');

          if (project.url && project.url !== "#") {
            liveLink.href = project.url;
            liveLink.style.display = "inline-block";
          } else {
            liveLink.style.display = "none";
          }

          // Update workshop link if available
          if (project.workshopUrl) {
            workshopLink.href = project.workshopUrl;
            workshopLink.style.display = "inline-block";
          } else {
            workshopLink.style.display = "none";
          }

          // Update video section if available
          const videoFrame = document.querySelector('.video-frame');
          if (project.videoUrl) {
            const iframe = videoFrame.querySelector('iframe');
            iframe.src = project.videoUrl;
            videoFrame.style.display = "block";
          } else {
            videoFrame.parentElement.style.display = "none";
          }

          // Update tech list
          if (techTags.length > 0) {
            const techList = document.querySelector('.tech-list');
            techList.innerHTML = '';
            techTags.forEach(tag => {
              const li = document.createElement('li');
              li.textContent = tag;
              techList.appendChild(li);
            });
          }

          // Update gallery section if available
          if (project.gallery) {
            const galleryContainer = document.getElementById('projectGallery');
            galleryContainer.innerHTML = '';

            project.gallery.forEach(item => {
              const galleryItem = document.createElement('div');
              galleryItem.className = 'gallery-item';

              const img = document.createElement('img');
              img.src = item.image;
              img.alt = item.caption || '';

              const caption = document.createElement('span');
              caption.className = 'gallery-caption';
              caption.textContent = item.caption || '';

              galleryItem.appendChild(img);
              galleryItem.appendChild(caption);
              galleryContainer.appendChild(galleryItem);
            });
          }
        }
      } catch (error) {
        console.error("Error loading project data:", error);
      }
    }

    initProject();
  </script>

  <div id="site-footer"></div>
</body>

</html>
