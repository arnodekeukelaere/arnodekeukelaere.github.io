<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;600;700&family=Roboto:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/shared-styles.css">
  <link rel="stylesheet" href="/shared-gallery.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Project Detail</title>
</head>

<body>
  <div id="site-nav"></div>

  <main class="project-detail">
    <div class="project-header">
      <img class="project-title" src="" alt="Project logo" />
    </div>

    <div class="project-description-row">
      <p id="projectDescription" class="project-description"></p>
      <div class="project-store-actions">
        <!-- Store action buttons will be populated by JavaScript -->
      </div>
    </div>

    <div class="project-meta">
      <div class="meta-item">
        <div class="meta-label">Project type</div>
        <div id="tags" class="meta-value"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Release Year</div>
        <div id="releaseYear" class="meta-value">-</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Platforms</div>
        <div id="platforms" class="meta-value">-</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Company</div>
        <div id="company" class="meta-value">-</div>
      </div>
    </div>

    <div class="project-content">
      <div class="yt-embed">
        <iframe src="" title="Project Demo Video" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="grid-row">
        <div class="project-section">
          <h2>What I did</h2>
          <h3>Development</h3>
          <ul>
            <li></li>
          </ul>
        </div>

        <div class="project-section tech-tags">
          <h2>Tech</h2>
          <!-- Tech tags will be populated by JavaScript -->
        </div>
      </div>
    </div>

    <div class="project-links">
      <!-- External links will be populated by JavaScript -->
    </div>
  </main>

  <script src="layout.js"></script>
  <script src="shared-gallery.js"></script>

  <script>
    // This script will be populated with individual project data
    async function initProject() {
      try {
        const projects = await window.SiteUtils.fetchJson("projects.json");
        const project = projects.find(p => p.title === "PROJECT_TITLE_PLACEHOLDER");

        if (project) {
          // Update title and description
          document.querySelector('.project-title').src = project.thumbnail || '';
          document.querySelector('.project-title').alt = project.title + " logo";
          document.getElementById('projectDescription').textContent = project.description || '-';

          // Update meta information
          document.getElementById('releaseYear').textContent = project.release || '-';
          document.getElementById('platforms').textContent = project.platforms ? project.platforms.join(', ') : '-';
          document.getElementById('company').textContent = project.company || '-';

          // Update tags
          const tags = project.tags || [];
          // Filter out category tags (Personal, Professional, School)
          const techTags = tags.filter(tag => !['Personal', 'Professional', 'School', '2010s', '2020s'].includes(tag));
          document.getElementById('tags').textContent = tags.includes("Professional") ? "Professional work" :
                                                        tags.includes("Personal") ? "Personal project" :
                                                        tags.includes("School") ? "School project" : "Project";

          // Set store action buttons if available
          const storeActionsContainer = document.querySelector('.project-store-actions');
          if (project.storeUrls && Array.isArray(project.storeUrls)) {
            storeActionsContainer.innerHTML = '';
            project.storeUrls.forEach(store => {
              const btn = document.createElement('a');
              btn.href = store.url;
              btn.textContent = store.name;
              btn.className = 'project-store-btn';
              btn.target = '_blank';
              btn.rel = 'noopener';
              storeActionsContainer.appendChild(btn);
            });
          } else if (project.url && project.url.startsWith('http')) {
            // Fallback to a single link
            const btn = document.createElement('a');
            btn.href = project.url;
            btn.textContent = 'Play Online';
            btn.className = 'project-store-btn';
            btn.target = '_blank';
            btn.rel = 'noopener';
            storeActionsContainer.appendChild(btn);
          }

          // Set links
          const linksContainer = document.querySelector('.project-links');
          if (project.links && Array.isArray(project.links)) {
            linksContainer.innerHTML = '';
            project.links.forEach(link => {
              const a = document.createElement('a');
              a.href = link.url;
              a.textContent = link.name;
              a.target = '_blank';
              a.rel = 'noopener';
              linksContainer.appendChild(a);
            });
          }

          // Update video section if available
          const iframe = document.querySelector('.yt-embed iframe');
          if (project.videoUrl) {
            iframe.src = project.videoUrl;
            iframe.style.display = "block";
          } else {
            iframe.parentElement.style.display = "none";
          }

          // Update tech list - this will be grouped by categories
          if (techTags.length > 0) {
            const techSection = document.querySelector('.project-section.tech-tags');
            techSection.innerHTML = '<h2>Tech</h2>'; // Keep the heading

            // For simplicity, we'll put all tech tags in one group since we don't have category data
            // In a real implementation, this would be more complex to categorize properly
            const techGroup = document.createElement('div');
            techGroup.className = 'tech-group';

            const techCategory = document.createElement('span');
            techCategory.className = 'tech-category';
            techCategory.textContent = 'Tools & Technologies:';

            const techList = document.createElement('ul');

            techTags.forEach(tag => {
              const li = document.createElement('li');
              li.textContent = tag;
              techList.appendChild(li);
            });

            techGroup.appendChild(techCategory);
            techGroup.appendChild(techList);
            techSection.appendChild(techGroup);
          }

          // Update development section if available
          if (project.development) {
            const devSection = document.querySelector('.project-section h3');
            if (devSection) {
              devSection.textContent = project.development.title || "Development";
              const ul = devSection.nextElementSibling;
              if (ul && ul.tagName === 'UL') {
                ul.innerHTML = '';
                project.development.points.forEach(point => {
                  const li = document.createElement('li');
                  li.textContent = point;
                  ul.appendChild(li);
                });
              }
            }
          }

          // Update gallery section if available
          if (project.gallery) {
            const galleryContainer = document.getElementById('projectGallery');
            if (galleryContainer) {
              galleryContainer.innerHTML = '';

              project.gallery.forEach(item => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.caption || '';

                const caption = document.createElement('span');
                caption.className = 'gallery-caption';
                caption.textContent = item.caption || '';

                galleryItem.appendChild(img);
                galleryItem.appendChild(caption);
                galleryContainer.appendChild(galleryItem);
              });
            }
          }
        }
      } catch (error) {
        console.error("Error loading project data:", error);
      }
    }

    initProject();
  </script>

  <div id="site-footer"></div>
</body>

</html>
