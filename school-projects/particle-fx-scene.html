<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared-styles.css">
  <title>Particle FX Scene</title>
  <style>
    .project-detail {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .project-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .project-title {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .project-thumbnail {
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .project-description {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
    }

    .meta-item {
      flex: 1;
      min-width: 150px;
    }

    .meta-label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #666;
    }

    .project-content {
      margin-top: 30px;
    }

    .project-links {
      margin-top: 20px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
    }

    .project-links a {
      display: inline-block;
      margin-right: 15px;
      margin-bottom: 10px;
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .project-links a:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <div class="project-detail">
    <div class="project-header">
      <h1 class="project-title">Particle FX Scene</h1>
    </div>

    <img id="projectThumbnail" class="project-thumbnail" src="" alt="Particle FX Scene thumbnail">

    <p id="projectDescription" class="project-description">Unreal Engine 4 particle effects.</p>

    <div class="project-meta">
      <div class="meta-item">
        <div class="meta-label">Release Year</div>
        <div id="releaseYear">-</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Platforms</div>
        <div id="platforms">PC</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Technologies</div>
        <div id="tags">Unreal</div>
      </div>
    </div>

    <div class="project-content">
      <p>Particle FX Scene is an Unreal Engine 4 particle effects project. This was a school project exploring visual effects in game development.</p>
    </div>

    <div class="project-links">
      <a id="liveLink" href="https://sites.google.com/view/arno-de-keukelaere/school-projects/particle-fx-scene" target="_blank">Play Online</a>
      <a id="sourceLink" href="#" target="_blank">Source Code</a>
      <a id="documentationLink" href="#" target="_blank">Documentation</a>
    </div>
  </div>

  <script src="../layout.js"></script>

  <script>
    // This script will be populated with individual project data
    async function initProject() {
      try {
        const projects = await window.SiteUtils.fetchJson("../projects.json");
        const project = projects.find(p => p.title === "Particle FX Scene");

        if (project) {
          document.querySelector('.project-title').textContent = project.title;
          document.getElementById('projectDescription').textContent = project.description;
          document.getElementById('releaseYear').textContent = project.release || '-';
          document.getElementById('platforms').textContent = project.platforms ? project.platforms.join(', ') : '-';

          const tags = project.tags || [];
          // Filter out category tags (Personal, Professional, School)
          const techTags = tags.filter(tag => !['Personal', 'Professional', 'School', '2010s', '2020s'].includes(tag));
          document.getElementById('tags').textContent = techTags.length > 0 ? techTags.join(', ') : '-';

          if (project.thumbnail) {
            const img = document.getElementById('projectThumbnail');
            img.src = project.thumbnail;
            img.alt = project.title + " thumbnail";
          }

          // Set links
          const liveLink = document.getElementById('liveLink');
          const sourceLink = document.getElementById('sourceLink');
          const documentationLink = document.getElementById('documentationLink');

          if (project.url && project.url !== "#") {
            liveLink.href = project.url;
            liveLink.style.display = "inline-block";
          } else {
            liveLink.style.display = "none";
          }

          // Hide source and documentation links by default
          sourceLink.style.display = "none";
          documentationLink.style.display = "none";
        }
      } catch (error) {
        console.error("Error loading project data:", error);
      }
    }

    initProject();
  </script>

  <div id="site-footer"></div>
</body>

</html>
