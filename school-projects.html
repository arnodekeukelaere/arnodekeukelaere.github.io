<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <title>School Projects</title>
  <style>
    /* Fallback styles in case test.css doesn't load properly */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 20px;
      line-height: 1.15;
      margin: 20px;
      background: white;
      color: #333;
    }

    .portfolio-wrapper {
      /* Removed border and padding */
      padding: 0;
      border: none;
    }

    .page-header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      color: black;
      line-height: 2;
      font-family: Roboto;
      font-weight: 800;
    }

    .page-title {
      font-size: 33px;
      font-weight: 900;
      font-style: normal;
      font-variant: normal;
      line-height: 1.2;
      text-align: left;
      text-indent: 0.0pt;
      color: #000;
      margin-bottom: 10px;
    }

    .page-description {
      font-size: 20px;
      color: #000;
      margin-bottom: 20px;
    }

    .projects {
      display: grid;
      /* Changed to grid for 2-column layout */
      grid-template-columns: 1fr 1fr;
      /* 2-column layout */
      gap: 15px;
      /* Removed border */
      border: none;
    }

    .project {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      /* Removed border */
      padding: 10px;
      text-decoration: none;
      color: black;
      transition: all 0.3s ease;
      position: relative;
    }

    .project:hover h2 {
      text-decoration: underline;
    }

    .thumbnail {
      width: 200px;
      height: 200px;
      background: lightgray;
      flex-shrink: 0;
      object-fit: cover;
    }

    .project-info {
      flex: 1;
      padding: 8px;
    }

    .project h2 {
      margin: 0;
      font-size: 24px;
      text-decoration: underline;
      text-decoration-color: transparent;
      color: #000;
      font-family: Roboto;
      font-weight: 900;
      font-style: normal;
      font-variant: normal;
      line-height: 1.38;
      text-align: left;
      text-indent: 0.0pt;
    }

    .project p {
      margin: 5px 0;
      font-size: 20px;
      color: #000;
    }

    .release-date {
      color: lightgray;
      font-size: 20px;
      margin-top: 5px;
    }

    .project a {
      color: black;
    }

    .return-to-home {
      margin-top: 20px;
      padding: 10px 15px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      text-decoration: none;
      color: #000;
      display: inline-block;
    }

    .return-to-home:hover {
      background: #e0e0e0;
    }

    /* Tablet: single column, moderately small thumbnails */
    @media (max-width: 1200px) {
      .projects {
        grid-template-columns: 1fr;
        /* Single column on tablets */
      }
    }

    /* Phone: single column, tiny thumbnails */
    @media (max-width: 600px) {
      .projects {
        grid-template-columns: 1fr;
      }

      .thumbnail {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="portfolio-wrapper">
    <h1>School projects</h1>

    <div class="page-header">
      <h1 class="page-title">Digital Arts & Entertainment (DAE)</h1>
      <p class="page-description">
        In 2018, I graduated from this university with a bachelor's degree in game development.<br>
        On this page, I've compiled some of my favourite projects that I worked on during my years there!
      </p>
    </div>

    <div class="projects" id="projects"></div>

    <!-- Return to home button instead of "Other things to click on" section -->
    <!-- <a href="home.html" class="return-to-home">Return to Home</a> -->
  </div>

  <script>
    // ---------- data ----------
    let projects = [];

    // ---------- helpers ----------
    function extractDriveId(url) {
      if (!url) return null;
      let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      if (/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
      return null;
    }

    function makeDriveCandidates(fileId) {
      if (!fileId) return [];
      return [
        `https://drive.google.com/uc?export=view&id=${fileId}`,
        `https://drive.google.com/thumbnail?id=${fileId}`,
        `https://drive.googleusercontent.com/uc?id=${fileId}&export=download`,
        `https://drive.google.com/uc?export=download&id=${fileId}`
      ];
    }

    function loadImageWithFallback(imgEl, originalUrl, driveViewerUrl) {
      const candidates = [];
      if (originalUrl) candidates.push(originalUrl);
      const driveId = extractDriveId(originalUrl || driveViewerUrl);
      if (driveId) {
        makeDriveCandidates(driveId).forEach(c => {
          if (!candidates.includes(c)) candidates.push(c);
        });
      }
      const placeholder = "https://via.placeholder.com/200?text=Image+unavailable";
      if (!candidates.includes(placeholder)) candidates.push(placeholder);

      let idx = 0;
      const tryNext = () => {
        if (idx >= candidates.length) {
          appendDriveDebugLink(imgEl, driveViewerUrl);
          return;
        }
        const url = candidates[idx++];
        let settled = false;
        const timeoutId = setTimeout(() => {
          if (settled) return;
          settled = true;
          tryNext();
        }, 5000);
        imgEl.onload = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          removeDriveDebugLink(imgEl);
        };
        imgEl.onerror = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          tryNext();
        };
        imgEl.src = url;
      };
      tryNext();
    }

    function appendDriveDebugLink(imgEl, driveViewerUrl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      if (parent.querySelector('.drive-debug')) return;
      if (!driveViewerUrl) return;
      const dbg = document.createElement('div');
      dbg.className = 'drive-debug';
      dbg.innerHTML = `<a href="${driveViewerUrl}" target="_blank" rel="noopener">Open image in Drive (check sharing)</a>`;
      parent.appendChild(dbg);
    }

    function removeDriveDebugLink(imgEl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      const dbg = parent.querySelector('.drive-debug');
      if (dbg) dbg.remove();
    }

    // ---------- UI rendering ----------
    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      // Filter projects to only include School ones
      const schoolProjects = projects.filter(p => p.tags.includes("School"));

      // Sort by release date (newest first)
      schoolProjects.sort((a, b) => b.release - a.release);

      // Render each project
      schoolProjects.forEach(project => {
        const a = document.createElement("a");
        a.href = project.url || "#";
        a.className = "project";
        a.target = "_blank";
        a.rel = "noopener";

        const thumb = document.createElement("img");
        thumb.className = "thumbnail";
        thumb.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
        a.appendChild(thumb);
        loadImageWithFallback(thumb, project.thumbnail, project.driveViewer);

        const info = document.createElement("div");
        info.className = "project-info";

        const title = document.createElement("h2");
        title.textContent = project.title;
        info.appendChild(title);

        const desc = document.createElement("p");
        desc.textContent = project.description;
        info.appendChild(desc);

        if (project.release) {
          const date = document.createElement("p");
          date.textContent = "Release date: " + project.release;
          date.className = "release-date";
          info.appendChild(date);
        }

        a.appendChild(info);
        container.appendChild(a);
      });
    }

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      try {
        const projectsResponse = await fetch('projects.json');
        if (!projectsResponse.ok) throw new Error('Failed to load projects.json');
        projects = await projectsResponse.json();

        renderProjects();
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById("projects").innerHTML = `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    // Run initialization on load
    initPortfolio();
  </script>
</body>

</html>
