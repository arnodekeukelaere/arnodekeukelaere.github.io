<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <title>School Projects</title>
  <style>
    /* Fallback styles in case test.css doesn't load properly */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 20px;
      line-height: 1.15;
      background: white;
      color: #333;

      margin-bottom: 75px;
    }

    .portfolio-wrapper {
      /* Removed border and padding */
      /* padding: 0; */
      border: none;
    }

    .projects {
      display: grid;
      /* Changed to grid for 2-column layout */
      grid-template-columns: 1fr 1fr;
      /* 2-column layout */
      gap: 15px;
      /* Removed border */
      border: none;
    }

    /* Tablet: single column, moderately small thumbnails */
    @media (max-width: 1200px) {
      .projects {
        grid-template-columns: 1fr;
        /* Single column on tablets */
      }
    }

    /* Phone: single column, tiny thumbnails */
    @media (max-width: 600px) {
      .projects {
        grid-template-columns: 1fr;
      }

      .thumbnail {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <div class="portfolio-wrapper">
    <h1>School projects</h1>

    <div class="page-header">
      <h1 class="page-title">Digital Arts & Entertainment (DAE)</h1>
      <p class="page-description">
        In 2018, I graduated from this university with a bachelor's degree in game development.<br>
        On this page, I've compiled some of my favourite projects that I worked on during my years there!
      </p>
    </div>

    <div class="projects" id="projects"></div>

    <!-- Return to home button instead of "Other things to click on" section -->
    <!-- <a href="home.html" class="return-to-home">Return to Home</a> -->
  </div>

  <script src="layout.js"></script>

  <script>
    // ---------- data ----------
    let projects = [];

    // ---------- UI rendering ----------
    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      // Filter projects to only include School ones and sort newest first
      const schoolProjects = projects
        .filter(p => p.tags && p.tags.includes("School"))
        .sort((a, b) => b.release - a.release);

      // Render each project
      schoolProjects.forEach(project => {
        const a = document.createElement("a");
        a.href = project.url || "#";
        a.className = "project";
        a.target = "_blank";
        a.rel = "noopener";

        const thumb = document.createElement("img");
        thumb.className = "thumbnail";
        thumb.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
        a.appendChild(thumb);
        window.SiteUtils.loadImageWithFallback(thumb, project.thumbnail, project.driveViewer);

        const info = document.createElement("div");
        info.className = "project-info";

        const title = document.createElement("h2");
        title.textContent = project.title;
        info.appendChild(title);

        const desc = document.createElement("p");
        desc.textContent = project.description;
        info.appendChild(desc);

        if (project.release) {
          const date = document.createElement("p");
          date.textContent = "Release date: " + project.release;
          date.className = "release-date";
          info.appendChild(date);
        }

        a.appendChild(info);
        container.appendChild(a);
      });
    }

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      try {
        const projectsResponse = await fetch("projects.json");
        if (!projectsResponse.ok) throw new Error("Failed to load projects.json");
        projects = await projectsResponse.json();

        renderProjects();
      } catch (error) {
        console.error("Error fetching data:", error);
        document.getElementById("projects").innerHTML =
          `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    initPortfolio();
  </script>
  <div id="site-footer"></div>

</body>

</html>
