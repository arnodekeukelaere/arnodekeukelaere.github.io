<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <title>School Projects</title>
  <style>
    /* Fallback styles in case test.css doesn't load properly */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 20px;
      line-height: 1.15;
      background: white;
      color: #333;

      margin-bottom: 75px;
    }

    .portfolio-wrapper {
      /* Removed border and padding */
      /* padding: 0; */
      border: none;
    }

    .projects {
      display: grid;
      /* Changed to grid for 2-column layout */
      grid-template-columns: 1fr 1fr;
      /* 2-column layout */
      gap: 15px;
      /* Removed border */
      border: none;
    }

    /* Tablet: single column, moderately small thumbnails */
    @media (max-width: 1200px) {
      .projects {
        grid-template-columns: 1fr;
        /* Single column on tablets */
      }
    }

    /* Phone: single column, tiny thumbnails */
    @media (max-width: 600px) {
      .projects {
        grid-template-columns: 1fr;
      }

      .thumbnail {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <div class="portfolio-wrapper">
    <h1>School projects</h1>

    <div class="page-header">
      <h1 class="page-title">Digital Arts & Entertainment (DAE)</h1>
      <p class="page-description">
        In 2018, I graduated from this university with a bachelor's degree in game development.<br>
        On this page, I've compiled some of my favourite projects that I worked on during my years there!
      </p>
    </div>

    <div class="projects" id="projects"></div>

    <!-- Return to home button instead of "Other things to click on" section -->
    <!-- <a href="home.html" class="return-to-home">Return to Home</a> -->
  </div>

  <script src="layout.js"></script>

  <script>
    // ---------- data ----------
    let projects = [];

    // ---------- helpers ----------
    function extractDriveId(url) {
      if (!url) return null;
      let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      if (/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
      return null;
    }

    function makeDriveCandidates(fileId) {
      if (!fileId) return [];
      return [
        `https://drive.google.com/uc?export=view&id=${fileId}`,
        `https://drive.google.com/thumbnail?id=${fileId}`,
        `https://drive.googleusercontent.com/uc?id=${fileId}&export=download`,
        `https://drive.google.com/uc?export=download&id=${fileId}`
      ];
    }

    function loadImageWithFallback(imgEl, originalUrl, driveViewerUrl) {
      const candidates = [];
      if (originalUrl) candidates.push(originalUrl);
      const driveId = extractDriveId(originalUrl || driveViewerUrl);
      if (driveId) {
        makeDriveCandidates(driveId).forEach(c => {
          if (!candidates.includes(c)) candidates.push(c);
        });
      }
      const placeholder = "https://via.placeholder.com/200?text=Image+unavailable";
      if (!candidates.includes(placeholder)) candidates.push(placeholder);

      let idx = 0;
      const tryNext = () => {
        if (idx >= candidates.length) {
          appendDriveDebugLink(imgEl, driveViewerUrl);
          return;
        }
        const url = candidates[idx++];
        let settled = false;
        const timeoutId = setTimeout(() => {
          if (settled) return;
          settled = true;
          tryNext();
        }, 5000);
        imgEl.onload = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          removeDriveDebugLink(imgEl);
        };
        imgEl.onerror = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          tryNext();
        };
        imgEl.src = url;
      };
      tryNext();
    }

    function appendDriveDebugLink(imgEl, driveViewerUrl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      if (parent.querySelector('.drive-debug')) return;
      if (!driveViewerUrl) return;
      const dbg = document.createElement('div');
      dbg.className = 'drive-debug';
      dbg.innerHTML = `<a href="${driveViewerUrl}" target="_blank" rel="noopener">Open image in Drive (check sharing)</a>`;
      parent.appendChild(dbg);
    }

    function removeDriveDebugLink(imgEl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      const dbg = parent.querySelector('.drive-debug');
      if (dbg) dbg.remove();
    }

    // ---------- UI rendering ----------
    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      // Filter projects to only include School ones
      const schoolProjects = projects.filter(p => p.tags.includes("School"));

      // Sort by release date (newest first)
      schoolProjects.sort((a, b) => b.release - a.release);

      // Render each project
      schoolProjects.forEach(project => {
        const a = document.createElement("a");
        a.href = project.url || "#";
        a.className = "project";
        a.target = "_blank";
        a.rel = "noopener";

        const thumb = document.createElement("img");
        thumb.className = "thumbnail";
        thumb.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
        a.appendChild(thumb);
        loadImageWithFallback(thumb, project.thumbnail, project.driveViewer);

        const info = document.createElement("div");
        info.className = "project-info";

        const title = document.createElement("h2");
        title.textContent = project.title;
        info.appendChild(title);

        const desc = document.createElement("p");
        desc.textContent = project.description;
        info.appendChild(desc);

        if (project.release) {
          const date = document.createElement("p");
          date.textContent = "Release date: " + project.release;
          date.className = "release-date";
          info.appendChild(date);
        }

        a.appendChild(info);
        container.appendChild(a);
      });
    }

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      try {
        const projectsResponse = await fetch('projects.json');
        if (!projectsResponse.ok) throw new Error('Failed to load projects.json');
        projects = await projectsResponse.json();

        renderProjects();
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById("projects").innerHTML = `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    // Run initialization on load
    initPortfolio();

    // Navigation menu toggle functionality
    document.addEventListener('DOMContentLoaded', function () {
      const hamburger = document.querySelector('.hamburger-menu');
      const navMenu = document.querySelector('.nav-menu');
      const overlay = document.querySelector('.overlay');
      const closeBtn = document.querySelector('.close-btn');

      function closeMenu() {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
        if (overlay) overlay.classList.remove('active');
      }

      function toggleMenu() {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
        if (overlay) overlay.classList.toggle('active');
      }

      if (hamburger && navMenu) {
        hamburger.addEventListener('click', toggleMenu);

        if (closeBtn) {
          closeBtn.addEventListener('click', closeMenu);
        }

        if (overlay) {
          overlay.addEventListener('click', closeMenu);
        }

        // Close menu when clicking on a navigation link
        const navLinks = document.querySelectorAll('.nav-menu a');
        navLinks.forEach(link => {
          link.addEventListener('click', function () {
            closeMenu();
          });
        });
      }

      // Expand/collapse submenus when clicking the toggle button
      const submenuToggles = document.querySelectorAll('.submenu-toggle');
      submenuToggles.forEach(toggle => {
        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          const parentItem = toggle.closest('.has-submenu');
          if (parentItem) {
            parentItem.classList.toggle('open');
          }
        });
      });

      // Mark the current page with .active and expand its parent submenu if nested
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      const allMenuLinks = document.querySelectorAll('.nav-menu a');
      allMenuLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href === currentPage) {
          link.classList.add('active');
          const parentSubmenu = link.closest('.has-submenu');
          if (parentSubmenu) {
            parentSubmenu.classList.add('open');
          }
        }
      });
    });

    // Dark mode toggle functionality
    document.addEventListener('DOMContentLoaded', function () {
      const darkModeToggle = document.getElementById('darkModeToggle');
      if (darkModeToggle) {
        // Check for saved theme preference or default to dark mode
        const isDarkMode = localStorage.getItem('darkMode') === 'true' ||
          (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);

        function setDarkMode(isDark) {
          if (isDark) {
            document.body.style.backgroundColor = '#181A1B';
            document.body.style.color = '#E8E6E3';
            document.querySelector('.site-footer').style.backgroundColor = '#181A1B';
            document.querySelector('.dark-mode-footer').style.backgroundColor = '#181A1B';
            document.body.setAttribute('data-theme', 'dark');
            // Update icon to sun for dark mode
            darkModeToggle.innerHTML = '☀️';
          } else {
            document.body.style.backgroundColor = 'white';
            document.body.style.color = 'black';
            document.querySelector('.site-footer').style.backgroundColor = 'white';
            document.querySelector('.dark-mode-footer').style.backgroundColor = 'white';
            document.body.setAttribute('data-theme', 'light');
            // Update icon to moon for light mode
            darkModeToggle.innerHTML = '🌙';
          }

          // Save preference
          localStorage.setItem('darkMode', isDark);
        }

        // Set initial theme
        setDarkMode(isDarkMode);

        // Toggle theme on button click
        darkModeToggle.addEventListener('click', function () {
          const currentIsDark = localStorage.getItem('darkMode') === 'true';
          setDarkMode(!currentIsDark);
        });
      }
    });
  </script>

  <div id="site-footer"></div>

</body>

</html>
