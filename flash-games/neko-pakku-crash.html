<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neko-Pakku Crash! - Flash Game</title>

    <link rel="stylesheet" href="../shared-styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #18222c;
            color: white;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            box-sizing: border-box;
        }

        .game-title {
            color: #1ad1ff;
            text-shadow: 2px 2px 0 #0d1217;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .game-description {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /*
         * The wrapper is responsive, but the actual Ruffle player
         * remains permanently at its native 1280x720 resolution.
         */
        .game-wrapper {
            position: relative;

            width: 100%;
            max-width: 1280px;

            aspect-ratio: 16 / 9;

            margin: 0 auto;

            background: #000;

            overflow: hidden;

            border: 3px solid #588544;
            box-shadow: 4px 4px 0 #0d1217;

            box-sizing: border-box;
        }

        /*
         * This element is always exactly 1280x720.
         * We only change its CSS transform to visually scale it.
         */
        #flash-game {
            position: absolute;

            width: 1280px;
            height: 720px;

            left: 50%;
            top: 50%;

            transform-origin: center center;

            transform: translate(-50%, -50%) scale(1);
        }

        /*
         * Keep Ruffle itself permanently at the SWF's
         * native resolution.
         */
        #flash-game ruffle-player {
            display: block;

            width: 1280px !important;
            height: 720px !important;
        }

        /*
         * When the wrapper enters browser fullscreen,
         * the wrapper fills the viewport.
         *
         * The Ruffle player still stays 1280x720.
         */
        .game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;

            max-width: none;

            aspect-ratio: auto;

            margin: 0;
            padding: 0;

            border: none;
            box-shadow: none;

            display: block;
        }

        .game-wrapper:fullscreen #flash-game {
            width: 1280px;
            height: 720px;
        }

        /*
         * Fullscreen button is deliberately BELOW the game
         * rather than over the Ruffle player.
         */
        #fullscreen-button {
            display: block;

            margin: 12px auto 0;

            padding: 8px 16px;

            font-family: 'Roboto', Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            background-color: #1ad1ff;
            border: 2px solid #0d1217;

            color: #0d1217;
        }

        #fullscreen-button:hover {
            filter: brightness(1.1);
        }

        .game-controls {
            display: flex;
            justify-content: center;

            margin-top: 1.5rem;
        }

        .game-controls .btn {
            display: inline-block;
        }
    </style>
</head>

<body>

    <!-- Shared navigation -->
    <div id="site-nav"></div>

    <main class="game-container">

        <h1 class="game-title">Neko-Pakku Crash!</h1>

        <p class="game-description">
            Play the original Neko-Pakku Crash! Flash game.
        </p>

        <!-- Game -->
        <div class="game-wrapper">

            <div id="flash-game"></div>

        </div>

        <!-- Fullscreen button -->
        <button id="fullscreen-button" type="button">
            ⛶ Fullscreen
        </button>

        <!-- Back to project -->
        <div class="game-controls">
            <a href="../personal-projects/neko-pakku-crash.html" class="btn">
                Back to Project Page
            </a>
        </div>

    </main>

    <!-- Shared site layout -->
    <script src="../layout.js"></script>

    <!-- Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        const gameWrapper = document.querySelector(".game-wrapper");
        const flashGame = document.getElementById("flash-game");
        const fullscreenButton = document.getElementById("fullscreen-button");

        /*
         * Keep the Ruffle player permanently at the SWF's
         * native 1280x720 resolution.
         */
        player.style.width = "1280px";
        player.style.height = "720px";
        player.style.display = "block";

        flashGame.appendChild(player);

        /*
         * Load the original SWF.
         */
        player.ruffle().load({
            url: "../assets/games/neko-pakku-crash/636474_Neko-Pakku_Crash!113[1].swf",

            /*
             * Let Ruffle render the original SWF at its
             * native aspect ratio.
             */
            scale: "showAll",
            letterbox: "on",

            allowFullscreen: true
        });

        /*
         * Visually scale the fixed 1280x720 game to fit
         * whatever size the wrapper currently has.
         *
         * IMPORTANT:
         * This does NOT resize Ruffle.
         * It only applies a CSS transform.
         */
        function scaleGame() {
            const width = gameWrapper.clientWidth;
            const height = gameWrapper.clientHeight;

            const scale = Math.min(
                width / 1280,
                height / 720
            );

            flashGame.style.transform =
                `translate(-50%, -50%) scale(${scale})`;
        }

        /*
         * Toggle browser fullscreen on the wrapper,
         * rather than fullscreening Ruffle itself.
         */
        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await gameWrapper.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen error:", error);
            }
        });

        /*
         * Update the button text whenever fullscreen
         * state changes, then recalculate the visual scale.
         */
        document.addEventListener("fullscreenchange", () => {

            if (document.fullscreenElement) {
                fullscreenButton.textContent = "✕ Exit Fullscreen";
            } else {
                fullscreenButton.textContent = "⛶ Fullscreen";
            }

            /*
             * Wait until the browser has applied the
             * new fullscreen dimensions.
             */
            requestAnimationFrame(scaleGame);
        });

        /*
         * Recalculate the visual scale whenever the
         * browser/window changes size.
         */
        window.addEventListener("resize", scaleGame);

        /*
         * Initial scaling.
         */
        scaleGame();
    </script>

</body>

</html>
