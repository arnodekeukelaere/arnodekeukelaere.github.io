<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <title>Project browser</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.15;
      margin: 0;
      background: white;
      padding: 20px 0;
      /* adjust to what looks good on mobile */
      margin-top: 40px;
    }

    p,
    li {
      margin-top: 6px;
      /* paragraph spacing before */
      margin-bottom: 0px;
      /* paragraph spacing after */
      font-size: 16px;
      /* increase from 14px to 16px */
    }

    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Roboto', Arial, sans-serif;
      line-height: 1.15;
      margin-top: 6px;
      margin-bottom: 0px;
    }

    * {
      box-sizing: border-box;
      line-height: 1.15;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .portfolio-wrapper {
      /* border: 1px solid #ccc; */
      /* border around entire portfolio */
      padding: 20px;
      /* spacing so content isn’t stuck to border */
      border-radius: 0px;
      /* optional: rounded corners */
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: darkgray;
      align-items: flex-start;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 0 0 auto;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-buttons button {
      padding: 10px 15px;
      border: 1px solid lightgray;
      /* keeps space reserved */
      border-top: 1px solid lightgray;
      /* reserve space for 3px top border */
      background: transparent;
      color: #555;
      /* dark gray text */
      font-size: 14px;
      cursor: pointer;
      transition: box-shadow 0.125s ease, border-color 0.125s ease;
      position: relative;
    }

    .filter-buttons button:hover {
      border-color: black;
      /* thin black border on hover */

      box-shadow: inset 0 3px 0 0 black;
      /* 3px top line, like projects */
    }

    .filter-buttons button.active {
      background: black;
      color: white;
      border-color: black;
      box-shadow: inset 0 3px 0 0 black;
      /* black top line */
    }

    .filter-buttons button.active:hover {
      background: #333;
      /* dark gray background instead of full black */
      color: white;
      border-color: #333;
      box-shadow: inset 0 3px 0 0 white;
      /* white top line, clearly visible */
    }

    .projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .project {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      border: 1px solid #ccc;
      /* regular border for all sides */
      border-top: 1px solid #ccc;
      /* keep layout consistent */
      padding: 10px;
      text-decoration: none;
      color: black;
      transition: box-shadow 0.125s ease;
      position: relative;
    }

    .project:hover {
      /* visual top border appears */
      box-shadow: inset 0 3px 0 0 black;
      /* 3px top line */
      border-color: black;
    }

    .project:hover h2 {
      text-decoration: underline;
    }

    .thumbnail {
      width: 124px;
      height: 124px;
      background: lightgray;
      flex-shrink: 0;
      object-fit: cover;
    }

    .project-info {
      flex: 1;
    }

    .project h2 {
      margin: 0;
      font-size: 20px;
      text-decoration: underline;
      text-decoration-color: transparent;
    }

    .project p {
      margin: 5px 0;
    }

    .project a {
      color: black;
    }

    .release-date {
      color: darkgray;
      font-size: 16px;
    }

    .tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 4px 8px;
      background: #ebebeb;
      /* subtle light gray */
      font-size: 14px;
      color: #555;
      /* dark gray text */
    }

    .no-results {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: #fffbea;
      border: 1px solid #facc15;
      /* amber-400 style */

      margin: 1rem 0;
      text-align: center;
      font-size: 0.95rem;
      color: #78350f;
    }

    .no-results.hidden {
      display: none;
    }

    .no-results-content {
      max-width: 400px;
    }

    .no-results .icon {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    #reset-filters {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: #facc15;
      border: none;

      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    #reset-filters:hover {
      background: #eab308;
    }

    .drive-debug {
      margin-top: 6px;
      font-size: 12px;
      color: #777;
    }

    .drive-debug a {
      color: #777;
      text-decoration: none;
    }

    .drive-debug a:hover {
      text-decoration: underline;
      color: #333;
    }

    .filter-buttons {
      gap: 6px;
    }

    .filter-buttons button {
      padding: 6px 10px;
      font-size: 12px;
    }

    /* Tablet: single column, moderately small thumbnails */
    @media (max-width: 1200px) {
      .projects {
        grid-template-columns: 1fr;
      }

      /* Phone: single column, tiny thumbnails */
      @media (max-width: 600px) {
        .projects {
          grid-template-columns: 1fr;
        }

        .thumbnail {
          width: 64px;
          height: 64px;
        }

        .filter-buttons {
          gap: 4px;
        }

        .filter-buttons button {
          padding: 4px 6px;
          font-size: 12px;
        }
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <div class="portfolio-wrapper">
    <div class="filters">
      <div class="filter-group">
        <div>Type:</div>
        <div class="filter-buttons" id="typeFilters"></div>
      </div>
      <div class="filter-group">
        <div>Engine:</div>
        <div class="filter-buttons" id="engineFilters"></div>
      </div>
      <div class="filter-group">
        <div>Language:</div>
        <div class="filter-buttons" id="languageFilters"></div>
      </div>
      <div class="filter-group">
        <div>Platform:</div>
        <div class="filter-buttons" id="platformFilters"></div>
      </div>
      <div class="filter-group">
        <div>Work period:</div>
        <div class="filter-buttons" id="periodFilters"></div>
      </div>
    </div>

    <div class="projects" id="projects"></div>
    <!-- Empty state message (hidden until triggered) -->
    <div id="no-results" class="no-results hidden">
      <div class="no-results-content">
        <span class="icon">⚠️</span>
        <p>No projects found.<br>
          Try adjusting or resetting the filters to see more results.
        </p>
        <button id="reset-filters">Reset Filters</button>
      </div>
    </div>

  </div>

  <script src="layout.js"></script>

  <script src="layout.js"></script>
  <script>
    // ---------- data ----------
    let projects = [];

    const filters = {
      Type: ["Personal", "Professional", "School"],
      Engine: ["Unity", "Unreal", "Other"],
      Language: ["C#", "C++"],
      Platform: ["PC", "Console", "Mobile"],
      Period: ["2020s", "2010s"]
    };

    // set default ON: 2020s
    const activeFilters = {
      Type: new Set(),
      Engine: new Set(),
      Language: new Set(),
      Platform: new Set(),
      Period: new Set(["2020s"])
    };

    // ---------- UI rendering ----------
    function renderFilters() {
      for (const [key, values] of Object.entries(filters)) {
        const container = document.getElementById(key.toLowerCase() + "Filters");
        if (!container) continue;
        container.innerHTML = "";

        values.forEach(value => {
          const btn = document.createElement("button");
          btn.textContent = value;

          if (activeFilters[key].has(value)) {
            btn.classList.add("active");
          }

          btn.onclick = () => {
            if (activeFilters[key].has(value)) {
              activeFilters[key].delete(value);
              btn.classList.remove("active");
            } else {
              activeFilters[key].add(value);
              btn.classList.add("active");
            }
            renderProjects();
          };

          container.appendChild(btn);
        });
      }
    }

    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      const filtered = projects.filter(p => {
        const tags = p.tags || [];
        return (!activeFilters.Type.size || [...activeFilters.Type].some(f => tags.includes(f)))
          && (!activeFilters.Engine.size || [...activeFilters.Engine].some(f => {
            if (f === "Other") {
              return !tags.includes("Unity") && !tags.includes("Unreal");
            }
            return tags.includes(f);
          }))
          && (!activeFilters.Language.size || [...activeFilters.Language].some(f => tags.includes(f)))
          && (!activeFilters.Period.size || [...activeFilters.Period].some(f => tags.includes(f)))
          && (!activeFilters.Platform.size || (p.platforms && [...activeFilters.Platform].some(f => p.platforms.includes(f))));
      });

      filtered.sort((a, b) => b.release - a.release);

      filtered.forEach(project => {
        container.appendChild(
          window.SiteUtils.createProjectCard(project, { showTags: true })
        );
      });

      checkResults();
    }

    function checkResults() {
      const results = document.querySelectorAll(".project");
      const noResults = document.getElementById("no-results");
      if (!noResults) return;
      noResults.classList.toggle("hidden", results.length > 0);
    }

    document.getElementById("reset-filters")?.addEventListener("click", () => {
      for (const key in activeFilters) {
        activeFilters[key].clear();
      }
      renderFilters();
      renderProjects();
    });

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      const container = document.getElementById("projects");
      try {
        projects = await window.SiteUtils.fetchJson("projects.json");
        renderFilters();
        renderProjects();
      } catch (error) {
        console.error("Error fetching projects:", error);
        container.innerHTML =
          `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    initPortfolio();
  </script>

  <div id="site-footer"></div>

</body>

</html>
