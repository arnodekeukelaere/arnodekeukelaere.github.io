<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <title>Professional Work</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.15;
      margin: 20px;
      background: white;
      color: #333;
    }

    p,
    li {
      margin-top: 6px;
      margin-bottom: 0px;
      font-size: 16px;
    }

    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Roboto', Arial, sans-serif;
      line-height: 1.15;
      margin-top: 6px;
      margin-bottom: 0px;
    }

    * {
      box-sizing: border-box;
      line-height: 1.15;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .portfolio-wrapper {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 0px;
    }

    .company-header {
      margin-top: 30px;
      margin-bottom: 15px;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    .company-title {
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }

    .company-description {
      font-size: 16px;
      color: #555;
      margin-bottom: 20px;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      border: 1px solid #ccc;
      padding: 10px;
      text-decoration: none;
      color: black;
      transition: box-shadow 0.125s ease;
      position: relative;
    }

    .project:hover {
      box-shadow: inset 0 3px 0 0 black;
      border-color: black;
    }

    .project:hover h2 {
      text-decoration: underline;
    }

    .thumbnail {
      width: 124px;
      height: 124px;
      background: lightgray;
      flex-shrink: 0;
      object-fit: cover;
    }

    .project-info {
      flex: 1;
    }

    .project h2 {
      margin: 0;
      font-size: 20px;
      text-decoration: underline;
      text-decoration-color: transparent;
    }

    .project p {
      margin: 5px 0;
    }

    .project a {
      color: black;
    }

    .release-date {
      color: darkgray;
      font-size: 16px;
    }

    .tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 4px 8px;
      background: #ebebeb;
      font-size: 14px;
      color: #555;
    }

    .links-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
    }

    .links-section h3 {
      margin-bottom: 15px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-item {
      padding: 8px 12px;
      background: #f5f5f5;
      border-left: 3px solid #000;
      text-decoration: none;
      color: #000;
      display: flex;
      align-items: center;
    }

    .link-item:hover {
      background: #e0e0e0;
      border-left-color: #333;
    }

    /* Tablet and mobile responsive */
    @media (max-width: 768px) {
      .projects {
        gap: 10px;
      }

      .project {
        flex-direction: column;
        align-items: stretch;
      }

      .thumbnail {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="portfolio-wrapper">
    <h1>Professional Work</h1>

    <div class="projects" id="projects"></div>

    <div class="links-section">
      <h3>Other things to click on</h3>
      <div class="links-list">
        <a href="project-browser.html" class="link-item">Interactive project browser</a>
        <a href="professional-work.html" class="link-item">Overview of my professional work in the game industry</a>
        <a href="personal-projects.html" class="link-item">Overview of my personal/hobby projects</a>
        <a href="https://www.linkedin.com/in/arno-de-keukelaere/" target="_blank" class="link-item">My LinkedIn page</a>
      </div>
    </div>
  </div>

  <script>
    // ---------- data ----------
    let projects = [];
    let companies = [];

    // ---------- helpers ----------
    function extractDriveId(url) {
      if (!url) return null;
      let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      if (/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
      return null;
    }

    function makeDriveCandidates(fileId) {
      if (!fileId) return [];
      return [
        `https://drive.google.com/uc?export=view&id=${fileId}`,
        `https://drive.google.com/thumbnail?id=${fileId}`,
        `https://drive.googleusercontent.com/uc?id=${fileId}&export=download`,
        `https://drive.google.com/uc?export=download&id=${fileId}`
      ];
    }

    function loadImageWithFallback(imgEl, originalUrl, driveViewerUrl) {
      const candidates = [];
      if (originalUrl) candidates.push(originalUrl);
      const driveId = extractDriveId(originalUrl || driveViewerUrl);
      if (driveId) {
        makeDriveCandidates(driveId).forEach(c => {
          if (!candidates.includes(c)) candidates.push(c);
        });
      }
      const placeholder = "https://via.placeholder.com/200?text=Image+unavailable";
      if (!candidates.includes(placeholder)) candidates.push(placeholder);

      let idx = 0;
      const tryNext = () => {
        if (idx >= candidates.length) {
          appendDriveDebugLink(imgEl, driveViewerUrl);
          return;
        }
        const url = candidates[idx++];
        let settled = false;
        const timeoutId = setTimeout(() => {
          if (settled) return;
          settled = true;
          tryNext();
        }, 5000);
        imgEl.onload = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          removeDriveDebugLink(imgEl);
        };
        imgEl.onerror = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          tryNext();
        };
        imgEl.src = url;
      };
      tryNext();
    }

    function appendDriveDebugLink(imgEl, driveViewerUrl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      if (parent.querySelector('.drive-debug')) return;
      if (!driveViewerUrl) return;
      const dbg = document.createElement('div');
      dbg.className = 'drive-debug';
      dbg.innerHTML = `<a href="${driveViewerUrl}" target="_blank" rel="noopener">Open image in Drive (check sharing)</a>`;
      parent.appendChild(dbg);
    }

    function removeDriveDebugLink(imgEl) {
      const parent = imgEl.parentNode;
      if (!parent) return;
      const dbg = parent.querySelector('.drive-debug');
      if (dbg) dbg.remove();
    }

    // ---------- UI rendering ----------
    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      // Filter projects to only include Professional ones
      const professionalProjects = projects.filter(p => p.tags.includes("Professional"));

      // Group projects by company
      const projectsByCompany = {};
      professionalProjects.forEach(project => {
        const company = project.company || "Unknown Company";
        if (!projectsByCompany[company]) {
          projectsByCompany[company] = [];
        }
        projectsByCompany[company].push(project);
      });

      // Render each company group
      for (const [companyName, companyProjects] of Object.entries(projectsByCompany)) {
        // Find company info
        const companyInfo = companies.find(c => c.title === companyName) || {
          title: companyName,
          description: `Information about ${companyName} will be added here.`
        };

        // Create company header
        const companyHeader = document.createElement("div");
        companyHeader.className = "company-header";

        const companyTitle = document.createElement("h2");
        companyTitle.className = "company-title";
        companyTitle.textContent = companyName;
        companyHeader.appendChild(companyTitle);

        const companyDesc = document.createElement("p");
        companyDesc.className = "company-description";
        companyDesc.textContent = companyInfo.description;
        companyHeader.appendChild(companyDesc);

        container.appendChild(companyHeader);

        // Render projects for this company
        companyProjects.forEach(project => {
          const a = document.createElement("a");
          a.href = project.url || "#";
          a.className = "project";
          a.target = "_blank";
          a.rel = "noopener";

          const thumb = document.createElement("img");
          thumb.className = "thumbnail";
          thumb.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
          a.appendChild(thumb);
          loadImageWithFallback(thumb, project.thumbnail, project.driveViewer);

          const info = document.createElement("div");
          info.className = "project-info";

          const title = document.createElement("h2");
          title.textContent = project.title;
          info.appendChild(title);

          const desc = document.createElement("p");
          desc.textContent = project.description;
          info.appendChild(desc);

          if (project.release) {
            const date = document.createElement("p");
            date.textContent = "Release date: " + project.release;
            date.className = "release-date";
            info.appendChild(date);
          }

          // Render tags
          const tagsDiv = document.createElement("div");
          tagsDiv.className = "tags";

          // Add project tags
          project.tags.forEach(t => {
            if (t !== "Professional") { // Skip the main tag
              const span = document.createElement("span");
              span.className = "tag";
              span.textContent = t;
              tagsDiv.appendChild(span);
            }
          });

          // Render platforms if they exist
          if (project.platforms) {
            project.platforms.forEach(f => {
              const span = document.createElement('span');
              span.className = 'tag';
              span.textContent = f;
              tagsDiv.appendChild(span);
            });
          }

          info.appendChild(tagsDiv);

          a.appendChild(info);
          container.appendChild(a);
        });
      }
    }

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      try {
        const projectsResponse = await fetch('projects.json');
        if (!projectsResponse.ok) throw new Error('Failed to load projects.json');
        projects = await projectsResponse.json();

        const companiesResponse = await fetch('companies.json');
        if (!companiesResponse.ok) throw new Error('Failed to load companies.json');
        companies = await companiesResponse.json();

        renderProjects();
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById("projects").innerHTML = `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    // Run initialization on load
    initPortfolio();
  </script>
</body>
</html>
