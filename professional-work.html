<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <title>Professional work</title>
  <style>
    body {
      margin-top: 60px;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 15px;
      /* Removed border */
      border: none;
    }

    /* Tablet and mobile responsive */
    @media (max-width: 768px) {
      .projects {
        gap: 10px;
      }

      .project {
        flex-direction: column;
        align-items: stretch;
      }

      .thumbnail {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <div class="portfolio-wrapper">
    <h1>Professional Work</h1>

    <div class="projects" id="projects"></div>

    <!-- Return to home button instead of "Other things to click on" section -->
    <!-- <a href="home.html" class="return-to-home">Return to Home</a> -->
  </div>

  <script src="layout.js"></script>

  <script>
    // ---------- data ----------
    let projects = [];
    let companies = [];

    // ---------- UI rendering ----------
    function renderProjects() {
      const container = document.getElementById("projects");
      container.innerHTML = "";

      const professionalProjects = projects.filter(
        p => p.tags && p.tags.includes("Professional")
      );

      // Group projects by company
      const projectsByCompany = {};
      professionalProjects.forEach(project => {
        const company = project.company || "Unknown Company";
        if (!projectsByCompany[company]) {
          projectsByCompany[company] = [];
        }
        projectsByCompany[company].push(project);
      });

      // Render each company group
      Object.entries(projectsByCompany).forEach(([companyName, companyProjects], index) => {
        const companyInfo = companies.find(c => c.title === companyName) || {
          title: companyName,
          description: `Information about ${companyName} will be added here.`
        };

        if (companyProjects.length > 0 && index > 0) {
          const spacingElement = document.createElement("div");
          spacingElement.style.marginTop = "60px";
          container.appendChild(spacingElement);
        }

        const companyHeader = document.createElement("div");
        companyHeader.className = "company-header";

        const companyTitle = document.createElement("h2");
        companyTitle.className = "company-title";
        companyTitle.textContent = companyName;
        companyHeader.appendChild(companyTitle);

        const companyDesc = document.createElement("p");
        companyDesc.className = "company-description";
        companyDesc.textContent = companyInfo.description;
        companyHeader.appendChild(companyDesc);

        container.appendChild(companyHeader);

        companyProjects.forEach(project => {
          container.appendChild(window.SiteUtils.createProjectCard(project));
        });
      });

      const bottomSpacing = document.createElement("div");
      bottomSpacing.style.marginTop = "60px";
      container.appendChild(bottomSpacing);
    }

    // ---------- initialization via Fetch ----------
    async function initPortfolio() {
      const container = document.getElementById("projects");
      try {
        [projects, companies] = await Promise.all([
          window.SiteUtils.fetchJson("projects.json"),
          window.SiteUtils.fetchJson("companies.json")
        ]);
        renderProjects();
      } catch (error) {
        console.error("Error fetching data:", error);
        container.innerHTML =
          `<p style="color: red;">Could not load project data. Make sure you are running via a local server.</p>`;
      }
    }

    initPortfolio();
  </script>

  <div id="site-footer"></div>

</body>

</html>
